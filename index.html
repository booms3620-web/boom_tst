<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>봉사보고 모바일 입력</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; }
    body { padding: 14px; margin: 0; background-color: #f8f9fa; color: #202124; }
    #auth-screen { max-width: 400px; margin: 40px auto 0; padding: 24px 18px; background: #ffffff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); text-align: center; border: 1px solid #e0e0e0; }
    #auth-screen h3 { margin: 0 0 8px 0; color: #1a73e8; font-size: 18px; }
    #auth-screen p { margin: 0 0 16px 0; font-size: 13px; color: #5f6368; line-height: 1.4; }
    #main-form-content { max-width: 440px; margin: 0 auto; background: #ffffff; padding: 18px 16px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); border: 1px solid #e8eaed; }
    .form-header { margin-bottom: 16px; padding-bottom: 12px; border-bottom: 2px solid #1a73e8; }
    .month-badge { display: inline-block; background: linear-gradient(135deg, #1a73e8, #1557b0); color: #ffffff; font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 16px; margin-bottom: 6px; }
    .form-header h2 { margin: 0 0 4px 0; font-size: 17px; color: #202124; }
    .form-header p { margin: 0; font-size: 12px; color: #5f6368; }
    .form-group { margin-bottom: 13px; }
    label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 12px; color: #3c4043; }
    select, input[type="number"], input[type="text"], input[type="password"], textarea { width: 100%; padding: 10px 11px; border: 1px solid #dadce0; border-radius: 6px; font-size: 15px; background-color: #fff; }
    select:focus, input:focus, textarea:focus { outline: none; border-color: #1a73e8; box-shadow: 0 0 0 2px rgba(26, 115, 232, 0.15); }
    input:disabled, select:disabled { background-color: #f1f3f4; color: #70757a; cursor: not-allowed; }
    .participate-card { background-color: #e8f0fe; border: 1px solid #c2e7ff; border-radius: 6px; padding: 10px 12px; margin-bottom: 13px; display: flex; align-items: flex-start; cursor: pointer; user-select: none; }
    .participate-card input[type="checkbox"] { width: 18px; height: 18px; margin: 2px 10px 0 0; cursor: pointer; accent-color: #1a73e8; }
    .participate-title { font-size: 13px; font-weight: 600; color: #1967d2; display: block; }
    .participate-desc { font-size: 11px; color: #5f6368; margin-top: 2px; display: block; line-height: 1.3; }
    textarea { resize: vertical; min-height: 55px; }
    .btn-submit { width: 100%; padding: 12px; background-color: #1a73e8; color: #ffffff; border: none; border-radius: 6px; font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 6px; }
    .btn-submit:hover { background-color: #1557b0; }
    .btn-submit:disabled { background-color: #bdc1c6; cursor: not-allowed; }
    .alert { padding: 10px 12px; border-radius: 6px; font-size: 13px; margin-top: 12px; display: none; line-height: 1.4; word-break: break-all; }
    .alert-success { background-color: #e6f4ea; color: #137333; border: 1px solid #ceead6; }
    .alert-danger { background-color: #fce8e6; color: #c5221f; border: 1px solid #fad2cf; }
  </style>
</head>
<body>

  <!-- 🔒 보안 인증 화면 -->
  <div id="auth-screen">
    <h3>🔒 보안 인증</h3>
    <p>봉사 보고 입력을 시작하려면<br>접속 비밀번호를 입력하세요.</p>
    <input type="password" id="accessPassword" placeholder="비밀번호 입력" inputmode="numeric" autofocus>
    <button type="button" class="btn-submit" onclick="checkPassword()" style="margin-top: 10px;">확인</button>
    <div id="errorMsg" class="alert alert-danger" style="margin-top: 10px;">비밀번호가 일치하지 않습니다.</div>
  </div>

  <!-- 📋 메인 보고 입력 폼 -->
  <div id="main-form-content" style="display: none;">
    <div class="form-header">
      <div class="month-badge">📅 봉사보고 입력</div>
      <h2>봉사보고 입력</h2>
      <p>집단과 전도인을 선택하고 보고를 저장하세요.</p>
    </div>

    <form id="reportForm" onsubmit="handleFormSubmit(event)">
      <div class="form-group">
        <label for="groupSelect">집단 선택 *</label>
        <select id="groupSelect" required>
          <option value="">집단을 선택하세요</option>
          <option value="마태">마태</option>
          <option value="마가">마가</option>
          <option value="누가">누가</option>
          <option value="요한">요한</option>
          <option value="야고보">야고보</option>
          <option value="베드로">베드로</option>
        </select>
      </div>

      <div class="form-group">
        <label for="nameInput">성명 *</label>
        <input type="text" id="nameInput" placeholder="전도인 성명 입력" required>
      </div>

      <label class="participate-card" id="participateCard">
        <input type="checkbox" id="participatedCheck" onchange="toggleHoursInput()">
        <div>
          <span class="participate-title">봉사 참여함 (시간 미기록 전도인)</span>
          <span class="participate-desc">체크 시 봉사시간 열에 '✔'로 기록됩니다.</span>
        </div>
      </label>

      <div class="form-group" id="hoursGroup">
        <label for="hoursInput">봉사시간 (파이오니아 등)</label>
        <input type="number" id="hoursInput" min="0" step="1" inputmode="numeric" placeholder="예: 15 (숫자만 입력)">
      </div>

      <div class="form-group">
        <label for="studiesInput">성서 연구 건수</label>
        <input type="number" id="studiesInput" min="0" step="1" inputmode="numeric" placeholder="예: 2">
      </div>

      <div class="form-group">
        <label for="remarksInput">비고</label>
        <textarea id="remarksInput" placeholder="특이사항 입력 (선택)"></textarea>
      </div>

      <button type="submit" id="submitBtn" class="btn-submit">보고 저장</button>
    </form>

    <div id="alertBox" class="alert"></div>
  </div>

  <script>
    const CORRECT_PASSWORD = "1935";

    // ★ [2단계]에서 복사한 Google Apps Script 웹 앱 URL을 아래 따옴표 안에 넣으세요
    const GOOGLE_SCRIPT_URL = "여기에_구글_웹앱_URL을_붙여넣으세요";

    function checkPassword() {
      const inputVal = document.getElementById('accessPassword').value;
      const errorDiv = document.getElementById('errorMsg');
      if (inputVal === CORRECT_PASSWORD) {
        document.getElementById('auth-screen').style.display = 'none';
        document.getElementById('main-form-content').style.display = 'block';
      } else {
        errorDiv.style.display = 'block';
        document.getElementById('accessPassword').value = '';
      }
    }

    document.getElementById('accessPassword').addEventListener('keyup', function(e) {
      if (e.key === 'Enter') checkPassword();
    });

    function toggleHoursInput() {
      const isChecked = document.getElementById('participatedCheck').checked;
      const hoursInput = document.getElementById('hoursInput');
      if (isChecked) {
        hoursInput.value = '';
        hoursInput.disabled = true;
        hoursInput.placeholder = "봉사 참여(✔) 선택됨";
      } else {
        hoursInput.disabled = false;
        hoursInput.placeholder = "예: 15 (숫자만 입력)";
      }
    }

    async function handleFormSubmit(e) {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const alertBox = document.getElementById('alertBox');
      alertBox.style.display = 'none';

      btn.disabled = true;
      btn.innerText = "저장 중...";

      const formData = {
        group: document.getElementById('groupSelect').value,
        name: document.getElementById('nameInput').value.trim(),
        participated: document.getElementById('participatedCheck').checked,
        hours: document.getElementById('hoursInput').value,
        studies: document.getElementById('studiesInput').value,
        remarks: document.getElementById('remarksInput').value
      };

      try {
        await fetch(GOOGLE_SCRIPT_URL, {
          method: "POST",
          mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(formData)
        });

        alertBox.className = "alert alert-success";
        alertBox.innerText = `[${formData.group}] ${formData.name} 님의 보고가 안전하게 전송되었습니다!`;
        alertBox.style.display = "block";

        document.getElementById('nameInput').value = '';
        document.getElementById('hoursInput').value = '';
        document.getElementById('studiesInput').value = '';
        document.getElementById('remarksInput').value = '';
        document.getElementById('participatedCheck').checked = false;
        toggleHoursInput();
      } catch (err) {
        alertBox.className = "alert alert-danger";
        alertBox.innerText = "전송 실패: " + err.message;
        alertBox.style.display = "block";
      } finally {
        btn.disabled = false;
        btn.innerText = "보고 저장";
      }
    }
  </script>
</body>
</html>
